<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floating Color Palettes</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="color-palettes">
            <h2>Dark Lemonade</h2>
            <h4 class="color" id="c1a">#845ec2</h4>
            <h4 class="color" id="c1b">#4e8397</h4>
            <h4 class="color" id="c1c">#d5cabd</h4>

            <h2>Taste the Dark Rainbow</h2>
            <h4 class="color" id="c1d">#aa78a6</h4>
            <h4 class="color" id="c1e">#b8bac8</h4>
            <h4 class="color" id="c1f">#b4d6d3</h4>
            <h4 class="color" id="c1g">#b2ffd6</h4>
            <h4 class="color" id="c1h">#d7fdf0</h4>
        </div>
        <div class="color-palettes">
            <h2>Dark Grey Friends</h2>
            <h4 class="color" id="c1i">#5ec2b1</h4>
            <h4 class="color" id="c1j">#00521c</h4>
