<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <!-- ADD YOUR HTML CODE INSIDE OF THIS DIV -->
            <div class="post-it hobbies">
                <h1>I Love Hobbies!</h1>
            </div>
            <div class="post-it periwinkle">
                <p>This is amazing!</p>
                <img 
                    src="images/architecture1.jpg" alt="Beautiful Architecture!" 
                    width="50%"
                >
            </div>
            <div class="post-it to-do">
                <h3>To Do:</h3>
                <ul>
                    <li>Craft Store</li>
                    <li>Go Thrifting</li>
                </ul>
            </div>
            <br>
            <div class="post-it motivational">
                <h4>Motivation</h4>
                <p>
                    "Work hard, be kind, and amazing things will happen."
                    <br>
                    <br>
                    -Conan O'brien
                </p>
            </div>
            <div class="post-it groceries">
                <h4>Grocery List:</h4>
                <ol>
                    <li>Apples</li>
                    <li>Coffee Creamer</li>
                </ol>
            </div>
            <div class="post-it staircase">
                <p>
                    Wow. 
                    <br>I want this in my life!
                </p>
                <img 
                    src="images/staircase1.jpg" alt="This is awesome!" 
                    width="45%"
                >
            </div>
            
        </div>
    </body>
</html>
