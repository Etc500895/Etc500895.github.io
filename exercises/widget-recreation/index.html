<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Widget Recreation</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="weather">
            <img 
                src="images/partlysunny.svg" 
                alt="the weather is partly sunny"
                id="sunny"
            >
            <p id="degree">
                81°
            </p>
            <p id="time">
                14:26
            </p>
            <p id="date-time">
                Wed 20 May
                <br>
                Seattle, WA
            </p>
        </div>
    </body>
</html>
